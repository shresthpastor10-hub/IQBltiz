<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="style_login.css">
</head>
<body>
    <div id="landingScreen">
    <h1 style="font-size:80px;">Bran<span class='highlight'>Blitz</span></h1>
    <div class="login-box">
    <h1>Sign-Up</h1>
    <form id="signupForm">
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" id="passwordInput" name="password" placeholder="Password (8-16 characters)" minlength=8 maxlength=16 required>
        <input type="password" id="confirmPasswordInput" name="confirmpassword" placeholder="Confirm Password" minlength=8 maxlength=16 required>
        <button type="submit">Sign-Up</button>
    </form>
    <p style="color:black;">Already have an account? <a href="login.html">Login</a></p>
    </div>
</body>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="pageTitle">Login</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div id="landingScreen">
        <h1 style="font-size:80px;">Bran<span class='highlight'>Blitz</span></h1>

        <div class="login-box" id="loginBox">
            <h1>Login</h1>
            <form id="loginForm">
                <input type="text" placeholder="Username" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p style="color:black;">Don't have an account? <a href="#signup" id="showSignup">Signup</a></p>
        </div>

        <div class="login-box hidden" id="signupBox">
            <h1>Sign-Up</h1>
            <form id="signupForm">
                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" id="passwordInput" name="password" placeholder="Password (8-16 characters)" minlength="8" maxlength="16" required>
                <input type="password" id="confirmPasswordInput" name="confirmpassword" placeholder="Confirm Password" minlength="8" maxlength="16" required>
                <button type="submit">Sign-Up</button>
            </form>
            <p style="color:black;">Already have an account? <a href="#login" id="showLogin">Login</a></p>
        </div>
    </div>
    <!--Toggle-ing between signup and login-->
    <script>
        const loginBox = document.getElementById('loginBox');
        const signupBox = document.getElementById('signupBox');
        const pageTitle = document.getElementById('pageTitle');
        const showSignup = document.getElementById('showSignup');
        const showLogin = document.getElementById('showLogin');

        function toggleAuth(mode) {
            if (mode === 'signup') {
                loginBox.classList.add('hidden');
                signupBox.classList.remove('hidden');
                pageTitle.textContent = 'Signup';
            } else {
                signupBox.classList.add('hidden');
                loginBox.classList.remove('hidden');
                pageTitle.textContent = 'Login';
            }
        }

        showSignup.addEventListener('click', function(e) {
            e.preventDefault();
            toggleAuth('signup');
        });

        showLogin.addEventListener('click', function(e) {
            e.preventDefault();
            toggleAuth('login');
        });

        // Support opening directly via #signup hash if needed
        if (window.location.hash === '#signup') {
            toggleAuth('signup');
        }
    </script>
</body>
</html>
